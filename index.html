<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Trip 2026</title>
<meta name="description" content="A 12306-verified rail (plus two flagged bus legs) loop through China — Beijing, Xi'an, Chongqing, Wulong Karst, Yunnan (Shilin, Jianshui, Dali), Guilin, Longji, Yangshuo, Shanghai, and Suzhou.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --ink: #10151f;
    --paper: #eef1ea;
    --card: #ffffff;
    --text: #1b2430;
    --text-muted: #5b6670;
    --rail: #c8102e;
    --rail-soft: rgba(200,16,46,0.12);
    --bus: #a8790a;
    --bus-soft: rgba(168,121,10,0.14);
    --line: rgba(27,36,48,0.12);
    --tag-culture: #6a4fa0;
    --tag-culture-soft: rgba(106,79,160,0.12);
    --tag-nature: #3c6e5c;
    --tag-nature-soft: rgba(60,110,92,0.12);
    --tag-city: #1d4e89;
    --tag-city-soft: rgba(29,78,137,0.12);
    --shadow: 0 1px 2px rgba(16,21,31,0.06), 0 8px 24px rgba(16,21,31,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef1ea;
      --paper: #10151f;
      --card: #171d28;
      --text: #eef1ea;
      --text-muted: #98a3ad;
      --rail-soft: rgba(255,90,110,0.16);
      --rail: #ff5a6e;
      --bus: #e0ab3f;
      --bus-soft: rgba(224,171,63,0.18);
      --line: rgba(238,241,234,0.14);
      --tag-culture: #b39ddb;
      --tag-culture-soft: rgba(179,157,219,0.16);
      --tag-nature: #7fbfa6;
      --tag-nature-soft: rgba(127,191,166,0.16);
      --tag-city: #7fb0e0;
      --tag-city-soft: rgba(127,176,224,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .masthead {
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 0.75rem 1.5rem;
    padding: 1.5rem clamp(1rem, 4vw, 3rem) 1.25rem;
    border-bottom: 1px solid var(--line);
    transition: padding 200ms ease;
  }
  .masthead__eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rail);
    margin: 0 0 0.4rem;
    transition: font-size 200ms ease, margin 200ms ease, opacity 150ms ease;
  }
  .masthead__title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    transition: font-size 200ms ease;
  }
  .masthead__meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.4rem;
  }
  @media (max-width: 640px) {
    .masthead__meta { align-items: flex-start; }
  }
  @media (max-width: 880px) {
    .masthead--compact { padding-top: 0.55rem; padding-bottom: 0.55rem; gap: 0.4rem 1rem; }
    .masthead--compact .masthead__eyebrow { font-size: 0; margin: 0; opacity: 0; }
    .masthead--compact .masthead__title { font-size: 1.15rem; }
    .masthead--compact .legend { display: none; }
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
    align-items: center;
    white-space: nowrap;
  }
  .legend__swatch { display: inline-flex; align-items: center; gap: 0.3rem; flex: none; }
  .legend__line { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--rail); }
  .legend__line--flag { border-top: 3px dashed var(--rail); }
  @media (max-width: 640px) {
    .legend { gap: 0.4rem; font-size: 0.6rem; flex-wrap: nowrap; }
    .legend__swatch { gap: 0.2rem; }
    .legend__speed { display: none; }
  }
  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(300px, 45fr) 55fr;
    min-height: 0;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
  }

  .map-wrap {
    position: relative;
    height: 100%;
    width: 100%;
    min-height: 0;
  }

  #map {
    height: 100%;
    width: 100%;
    background: var(--card);
  }

  .leaflet-control-attribution { display: none !important; }

  .map-back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    position: absolute;
    left: 1rem;
    bottom: 1rem;
    z-index: 500;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.5rem 1rem 0.5rem 0.8rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--rail);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .map-back svg { width: 13px; height: 13px; flex: none; }
  .map-back:hover { background: var(--rail); color: var(--card); }

  .panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    border-left: 1px solid var(--line);
  }
  @media (max-width: 880px) {
    .panel { border-left: none; border-top: 1px solid var(--line); }
  }

  .totalbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.3rem 0.9rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .totalbar strong { color: var(--text); font-variant-numeric: tabular-nums; }

  /* Calendar */
  .calendar {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .calendar__weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    flex: none;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--card);
    z-index: 2;
  }
  .calendar__weekday {
    padding: 0.45rem 0.3rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
  }
  .calendar__grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(92px, auto);
    gap: 1px;
    background: var(--line);
  }
  .day {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    padding: 0.4rem 0.5rem;
    border: none;
    background: var(--card);
    cursor: pointer;
    transition: background 120ms ease;
    position: relative;
  }
  .day:hover, .day.is-active { background: var(--rail-soft); }
  .day--pad { cursor: default; opacity: 0.32; }
  .day--pad:hover { background: var(--card); }
  .day__head { display: flex; align-items: baseline; gap: 0.3rem; flex: none; }
  .day__num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .day__mon {
    display: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    color: var(--rail);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .day__mon--start { display: inline; }
  .day__body { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 0.3rem; }
  .day__city {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    line-height: 1.2;
    white-space: normal;
    overflow-wrap: break-word;
  }
  .day__trains { display: flex; flex-direction: column; gap: 0.2rem; }
  .day__train-line {
    display: flex;
    align-items: flex-start;
    gap: 0.3rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.58rem;
    color: var(--text-muted);
    min-width: 0;
  }
  .day__train-text {
    min-width: 0;
    white-space: normal;
    overflow-wrap: break-word;
  }
  .day__badge { display: none; }

  @media (max-width: 880px) {
    /* Preview: grid view instead of the row list, same shape as desktop, sized down. */
    .calendar__weekday { font-size: 0.52rem; padding: 0.3rem 0.1rem; }
    .calendar__grid { grid-auto-rows: minmax(72px, auto); }
    .day { padding: 0.3rem 0.35rem; gap: 0.15rem; }
    .day__head { gap: 0.18rem; }
    .day__num { font-size: 0.62rem; }
    .day__mon--start { font-size: 0.55rem; }
    .day__city { font-size: 0.64rem; line-height: 1.15; }
    .day__trains { gap: 0.1rem; }
    .day__train-line { font-size: 0.46rem; gap: 0.15rem; }
    .hsr-pill--sm { width: 0.8rem; height: 0.8rem; font-size: 0.38rem; border-radius: 2px; }
  }

  /* Day detail */
  .day-detail {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    flex-direction: column;
  }
  .panel--detail .calendar { display: none; }
  .panel--detail .day-detail { display: flex; }

  .detail__header {
    flex: none;
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 1rem clamp(1rem, 3vw, 1.75rem) 0.9rem;
  }
  .detail__back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--rail-soft);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0.4rem 0.8rem 0.4rem 0.6rem;
    margin: 0 0 0.75rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--rail);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .detail__back svg { width: 13px; height: 13px; flex: none; }
  .detail__back:hover { background: var(--rail); color: var(--card); }
  .detail__back:active { transform: translateX(-1px); }
  @media (max-width: 880px) { .detail__back { display: none; } }
  .map-back { display: none; }
  @media (max-width: 880px) {
    .map-back.is-active { display: inline-flex; }
  }
  .detail__date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rail);
    margin: 0 0 0.2rem;
  }
  .detail__title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(1.05rem, 1.8vw, 1.4rem);
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
  }

  .detail__body { padding: 0.25rem clamp(1rem, 3vw, 1.75rem) 2rem; }
  .detail__section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 1.25rem 0 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .detail__section:first-child .detail__section-label { margin-top: 0.25rem; }
  .detail__section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .transport-card, .stay-card, .site-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.7rem 0.85rem;
  }
  .transport-card + .transport-card, .site-card + .site-card { margin-top: 0.5rem; }
  .transport-card__head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
  .transport-card__route { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 0.83rem; line-height: 1.25; }
  .transport-card__time { font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--text); font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; flex: none; }
  .transport-card__meta { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; color: var(--text-muted); margin: 0; }

  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-dot--confirmed { background: var(--tag-nature); }
  .status-dot--unbooked { background: var(--bus); }

  .stay-card__head { display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.35rem; }
  .stay-card__name { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 0.83rem; }
  .stay-card__note { font-size: 0.78rem; line-height: 1.45; color: var(--text); margin: 0; }

  .site-card { display: flex; flex-direction: column; gap: 0.3rem; }
  .site-card__head { display: flex; align-items: baseline; gap: 0.5rem; }
  .site-card__name { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 0.82rem; }
  .site-card__flag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--bus);
    border: 1px solid var(--bus);
    border-radius: 3px;
    padding: 0.05rem 0.35rem;
    flex: none;
    margin-left: auto;
    white-space: nowrap;
  }
  .site-card__note { font-size: 0.78rem; line-height: 1.45; color: var(--text-muted); margin: 0; }

  .detail__empty { font-size: 0.78rem; color: var(--text-muted); font-style: italic; margin: 0; }

  .hsr-pill {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--card);
  }
  .hsr-pill--g { background: var(--rail); }
  .hsr-pill--d { background: var(--tag-city); }
  .hsr-pill--c { background: var(--tag-nature); }
  .hsr-pill--bus { background: var(--bus); font-size: 0.55rem; }
  .hsr-pill--sm { flex: none; width: 1.05rem; height: 1.05rem; font-size: 0.52rem; border-radius: 3px; }
  .hsr-pill--sm.hsr-pill--bus { font-size: 0.42rem; }

  .leaflet-popup-content-wrapper {
    background: var(--card);
    color: var(--text);
    border-radius: 6px;
  }
  .leaflet-popup-tip { background: var(--card); }
  .leaflet-popup-content { margin: 0; width: 460px !important; }
  .popup { display: flex; flex-direction: column; align-items: stretch; gap: 0; height: 420px; }
  .popup__info { flex: 0 0 40%; min-width: 0; padding: 0.5rem 0.7rem; display: flex; flex-direction: column; justify-content: flex-start; gap: 0.1rem; overflow-y: auto; }
  .popup__media { flex: 1 1 60%; min-width: 0; min-height: 0; }
  .popup__name { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.3rem; line-height: 1; margin: 0 !important; }
  .popup__dates { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--text-muted); margin: 0.1rem 0 !important; }
  .popup__note { font-size: 0.82rem; margin: 0 !important; line-height: 1.2; }

  .carousel {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    border-radius: 0 0 6px 6px;
  }
  .carousel__track {
    display: flex;
    height: 100%;
    transition: transform 220ms ease;
  }
  .carousel__slide { flex: none; width: 100%; height: 100%; position: relative; }
  .carousel__img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .carousel__caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0.25rem 0.5rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
  }
  .carousel__btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(16,21,31,0.45);
    color: #fff;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .carousel__btn:hover { background: rgba(16,21,31,0.7); }
  .carousel__btn--prev { left: 6px; }
  .carousel__btn--next { right: 6px; }
  .carousel__dots {
    position: absolute;
    bottom: 4px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 4px;
  }
  .carousel__dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5); }
  .carousel__dot.is-active { background: #fff; }

  @media (max-width: 640px) {
    .leaflet-popup-content { width: 220px !important; }
    .popup { height: 260px; }
    .popup__info { flex-basis: 78px; padding: 0.4rem 0.4rem; gap: 0; }
    .popup__name { font-size: 0.76rem; line-height: 1.05; margin: 0; }
    .popup__dates { font-size: 0.5rem; margin: 0; }
    .popup__note {
      font-size: 0.58rem;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .carousel__caption { font-size: 0.46rem; padding: 0.15rem 0.3rem; }
    .carousel__btn { width: 30px; height: 30px; font-size: 1rem; }
    .carousel__btn--prev { left: 4px; }
    .carousel__btn--next { right: 4px; }
    .carousel__dots { bottom: 3px; gap: 3px; }
    .carousel__dot { width: 4px; height: 4px; }
  }

  .leaflet-tooltip.leg-label {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    font-weight: 500;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .leaflet-tooltip.leg-label::before { display: none; }

  @media (max-width: 880px) {
    /* Save vertical space: drop the totals line, pin the legend beside the title instead of stacking below it. */
    .totalbar { display: none; }
    .masthead { flex-wrap: nowrap; align-items: flex-start; }
    .masthead__title-block { flex: 1 1 auto; min-width: 0; }
    .masthead__title { font-size: 1.5rem; white-space: nowrap; }
    .masthead__eyebrow { font-size: 0.6rem; margin: 0 0 0.15rem; white-space: nowrap; }
    .masthead__meta { flex: none; align-items: flex-end; }
    .legend { display: grid; grid-template-columns: repeat(3, auto); gap: 0.25rem 0.6rem; justify-content: flex-end; max-width: none; font-size: 0.6rem; white-space: nowrap; }
    .legend__swatch { justify-content: flex-start; }
    .legend__speed { display: none; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead__title-block">
    <p class="masthead__eyebrow">Sep 30 – Oct 28 · 2026</p>
    <h1 class="masthead__title">China Trip 2026</h1>
  </div>
  <div class="masthead__meta">
    <div class="legend">
      <span class="legend__swatch"><span class="hsr-pill hsr-pill--g">G</span> Gaotie <span class="legend__speed">(350km/h)</span></span>
      <span class="legend__swatch"><span class="hsr-pill hsr-pill--d">D</span> Dongche <span class="legend__speed">(250km/h)</span></span>
      <span class="legend__swatch"><span class="hsr-pill hsr-pill--c">C</span> Chengji <span class="legend__speed">(200km/h)</span></span>
      <span class="legend__swatch"><span class="hsr-pill hsr-pill--bus">BUS</span> no rail</span>
      <span class="legend__swatch"><span class="legend__line legend__line--flag"></span> long day</span>
    </div>
    <div class="totalbar" id="totalbar"></div>
  </div>
</header>

<div class="layout">
  <div class="map-wrap">
    <div id="map"></div>
    <button class="map-back" id="mapBack" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Calendar</button>
  </div>
  <div class="panel">
    <div class="calendar" id="calendar">
      <div class="calendar__weekdays">
        <span class="calendar__weekday">Mon</span>

let carouselSeq = 0;
function buildCarousel(cityName) {
  const images = CITY_IMAGES[cityName];
  if (!images || !images.length) return '';
  const id = `car${carouselSeq++}`;
  const slides = images.map(img => `
    <div class="carousel__slide">
      <img class="carousel__img" src="${img.url}" alt="${img.caption}" loading="lazy">
      <span class="carousel__caption">${img.caption}</span>
    </div>
  `).join('');
  const dots = images.map((_, i) => `<span class="carousel__dot${i === 0 ? ' is-active' : ''}"></span>`).join('');
  return `
    <div class="carousel" id="${id}" data-index="0" data-count="${images.length}">
      <div class="carousel__track">${slides}</div>
      ${images.length > 1 ? `
        <button class="carousel__btn carousel__btn--prev" onclick="carouselNav('${id}', -1)">‹</button>
        <button class="carousel__btn carousel__btn--next" onclick="carouselNav('${id}', 1)">›</button>
        <div class="carousel__dots">${dots}</div>
      ` : ''}
    </div>
  `;
}

window.carouselNav = function(id, delta) {
  const el = document.getElementById(id);
  if (!el) return;
  const count = +el.dataset.count;
  let idx = (+el.dataset.index + delta + count) % count;
  el.dataset.index = idx;
  el.querySelector('.carousel__track').style.transform = `translateX(-${idx * 100}%)`;
  el.querySelectorAll('.carousel__dot').forEach((d, i) => d.classList.toggle('is-active', i === idx));
};

function parseDuration(str) {
  const h = /(\d+)h/.exec(str), m = /(\d+)m/.exec(str);
  return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
}
function formatDuration(mins) {
  return `${Math.floor(mins / 60)}h${String(mins % 60).padStart(2, '0')}m`;
}

const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pillColor = cls => cls === 'G' ? cssVar('--rail') : cls === 'D' ? cssVar('--tag-city') : cls === 'C' ? cssVar('--tag-nature') : cssVar('--bus');
const tagColor = tag => cssVar(`--tag-${tag}`);
const mapFitPadding = () => window.innerWidth <= 880 ? [20, 20] : [60, 60];

const map = L.map('map', { scrollWheelZoom: true }).setView([30, 108], 4);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18,
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap contributors, GIS User Community'
}).addTo(map);

const layerGroup = L.layerGroup().addTo(map);
const calendarGrid = document.getElementById('calendarGrid');
const dayDetail = document.getElementById('dayDetail');
const totalbar = document.getElementById('totalbar');
const byId = Object.fromEntries(stops.map(s => [s.id, s]));
const markers = {};

function markerIcon(stop) {
  const color = tagColor(stop.tag);
  const isDaytrip = stop.kind === 'daytrip';
  const size = isDaytrip ? 16 : 28;
  const style = isDaytrip
    ? `width:${size}px;height:${size}px;border-radius:50%;background:var(--card);border:2px solid ${color};`
    : `width:${size}px;height:${size}px;border-radius:50%;background:var(--card);border:2.5px solid ${color};color:${color};display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;box-shadow:0 2px 6px rgba(16,21,31,0.25);`;
  const label = isDaytrip ? '' : stop.name.charAt(0);
  return L.divIcon({
    className: '',
    html: `<div style="${style}">${label}</div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -14],
  });
}

function renderMap() {
  layerGroup.clearLayers();
  stops.forEach(stop => {
    const marker = L.marker(stop.coord, { icon: markerIcon(stop) }).addTo(layerGroup);
    marker.bindPopup(`
      <div class="popup">
        <div class="popup__info">
          <p class="popup__name">${stop.name}</p>
          <p class="popup__dates">${stop.dates}</p>
          <p class="popup__note">${stop.note}</p>
        </div>
        <div class="popup__media">${buildCarousel(stop.name)}</div>
      </div>
    `, { minWidth: 380, maxWidth: 380, autoPan: true, autoPanPadding: [20, 20] });
    markers[stop.id] = marker;
  });
  legs.forEach(leg => {
    if (leg.mapSkip) return;
    const from = byId[leg.from], to = byId[leg.to];
    if (!from || !to) return;
    const label = leg.mapLabel || leg.duration;
    const style = { color: pillColor(leg.cls), weight: 3, dashArray: (leg.flag || leg.mode === 'bus' || leg.daytrip) ? '9 6' : null, opacity: 0.9 };
    if (leg.daytrip) {
      // Day trips are round trips: draw two parallel offset lines (there and back)
      // instead of one, with the one-way duration labeled at the center.
      const [fLat, fLon] = from.coord, [tLat, tLon] = to.coord;
      const dLat = tLat - fLat, dLon = tLon - fLon;
      const len = Math.hypot(dLat, dLon) || 1;
      const offsetMag = Math.min(len * 0.08, 0.12);
      const oLat = (-dLon / len) * offsetMag / 2, oLon = (dLat / len) * offsetMag / 2;
      L.polyline([[fLat + oLat, fLon + oLon], [tLat + oLat, tLon + oLon]], style).addTo(layerGroup);
      L.polyline([[fLat - oLat, fLon - oLon], [tLat - oLat, tLon - oLon]], style).addTo(layerGroup);
      L.polyline([from.coord, to.coord], { opacity: 0 }).addTo(layerGroup)
        .bindTooltip(label, { permanent: true, direction: 'center', className: 'leg-label' });
    } else {
      L.polyline([from.coord, to.coord], style).addTo(layerGroup)
        .bindTooltip(label, { permanent: true, direction: 'center', className: 'leg-label' });
    }
  });
  const bounds = L.latLngBounds(stops.map(s => s.coord));
  map.fitBounds(bounds, { padding: mapFitPadding() });

  const totalMins = legs.reduce((sum, l) => sum + parseDuration(l.duration), 0);
  const busMins = legs.filter(l => l.mode === 'bus').reduce((sum, l) => sum + parseDuration(l.duration), 0);
  totalbar.innerHTML = `<span>Total transit: <strong>${formatDuration(totalMins)}</strong> across ${legs.length} legs (${formatDuration(busMins)} by bus)</span>`;
}

function flyToStop(stopId) {
  const stop = byId[stopId];
  if (!stop || !markers[stopId]) return;
  map.flyTo(stop.coord, 7, { duration: 0.8 });
  map.once('moveend', () => markers[stopId].openPopup());
}

function cleanLabel(label) {
  return label.replace(/\s*\([^)]*\)\s*$/, '').replace(/,\s*[^,]*$/, '').trim();
}
function buildTrainLine(leg) {
  if (!leg) return '';
  const key = leg.cls === 'BUS' ? 'bus' : leg.cls.toLowerCase();
  const badge = leg.cls === 'BUS' ? 'BUS' : leg.cls;
  let numPart = '';
  if (leg.train) {
    numPart = leg.train.replace(new RegExp('^' + leg.cls + '\\s*'), '').trim();
  }
  const timePart = (leg.dep && leg.arr) ? `${leg.dep}–${leg.arr}` : leg.duration;
  const text = numPart ? `${numPart} · ${timePart}` : timePart;
  return `<span class="day__train-line"><span class="hsr-pill hsr-pill--${key} hsr-pill--sm">${badge}</span><span class="day__train-text">${text}</span></span>`;
}
function pad(n) { return String(n).padStart(2, '0'); }
function toISODate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function accommodationFor(entry) {
  const baseId = DAYTRIP_BASE[entry.stopId];
  if (baseId) {
    const base = byId[baseId];
    return { status: 'daytrip', label: `Day trip — based in ${base.name}`, note: `No separate stay tonight — back to ${base.name} the same evening.` };
  }
  return ACCOMMODATION[entry.stopId];
}

function renderLegCard(leg) {
  const key = leg.cls === 'BUS' ? 'bus' : leg.cls.toLowerCase();
  const badge = leg.cls === 'BUS' ? 'BUS' : leg.cls;
  const timePart = (leg.dep && leg.arr) ? `${leg.dep} – ${leg.arr}` : '';
  return `
    <div class="transport-card">
      <div class="transport-card__head">
        <span class="hsr-pill hsr-pill--${key}">${badge}</span>
        <span class="transport-card__route">${leg.route}</span>
        ${timePart ? `<span class="transport-card__time">${timePart}</span>` : ''}
      </div>
      ${leg.train ? `<p class="transport-card__meta">${leg.train}</p>` : ''}
    </div>
  `;
}

function renderTransportSection(entry) {
  if (!entry.legIdx || !entry.legIdx.length) {
    return `<p class="detail__empty">No transport today — based in ${byId[entry.stopId].name}.</p>`;
  }
  return entry.legIdx.map(i => {
    const leg = legs[i];
    let html = renderLegCard(leg);
    if (leg.retDep) {
      html += renderLegCard({ train: leg.retTrain, route: leg.retRoute, dep: leg.retDep, arr: leg.retArr, cls: leg.cls });
    }
    return html;
  }).join('');
}

function renderStaySection(entry) {
  const stay = accommodationFor(entry);
  if (!stay) return '<p class="detail__empty">No accommodation info for this stop yet.</p>';
  const dotClass = stay.status === 'confirmed' ? 'status-dot--confirmed' : stay.status === 'unbooked' ? 'status-dot--unbooked' : '';
  return `
    <div class="stay-card">
      <div class="stay-card__head">
        ${dotClass ? `<span class="status-dot ${dotClass}"></span>` : ''}
        <span class="stay-card__name">${stay.label}</span>
      </div>
      <p class="stay-card__note">${stay.note}</p>
    </div>
  `;
}

function renderSitesSection(entry) {
  const parts = [];
  if (entry.note) {
    parts.push(`<div class="site-card"><p class="site-card__note" style="color:var(--text)">${entry.note}</p></div>`);
  }
  (entry.reservations || []).forEach(r => {
    parts.push(`
      <div class="site-card">
        <div class="site-card__head">
          <span class="site-card__name">${r.name}</span>
          <span class="site-card__flag">${r.flag || 'Book ahead'}</span>
        </div>
        <p class="site-card__note">${r.note}</p>
      </div>
    `);
  });
  if (!parts.length) parts.push('<p class="detail__empty">Nothing specific planned yet.</p>');
  return parts.join('');
}

function renderDayDetail(dateIso) {
  const entry = days.find(d => d.date === dateIso);
  if (!entry) return;
  const d = new Date(entry.date + 'T00:00:00');
  const dateLabel = `${WEEKDAY_ABBR[d.getDay()]} · ${MONTH_ABBR[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  dayDetail.innerHTML = `
    <div class="detail__header">
      <button class="detail__back" id="detailBack" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Calendar</button>
      <p class="detail__date">${dateLabel}</p>
      <h2 class="detail__title">${entry.label}</h2>
    </div>
    <div class="detail__body">
      <div class="detail__section">
        <p class="detail__section-label">Transportation</p>
        ${renderTransportSection(entry)}
      </div>
      <div class="detail__section">
        <p class="detail__section-label">Accommodation</p>
        ${renderStaySection(entry)}
      </div>
      <div class="detail__section">
        <p class="detail__section-label">Sites &amp; reservations</p>
        ${renderSitesSection(entry)}
      </div>
    </div>
  `;
}

const mapBack = document.getElementById('mapBack');
mapBack.addEventListener('click', showCalendarView);

function showDayDetail(dateIso) {
  renderDayDetail(dateIso);
  document.querySelector('.panel').classList.add('panel--detail');
  mapBack.classList.add('is-active');
  document.getElementById('detailBack').addEventListener('click', showCalendarView);
  dayDetail.scrollTop = 0;
}
function showCalendarView() {
  document.querySelector('.panel').classList.remove('panel--detail');
  mapBack.classList.remove('is-active');
  map.closePopup();
  const bounds = L.latLngBounds(stops.map(s => s.coord));
  map.flyToBounds(bounds, { padding: mapFitPadding() });
}

function renderCalendar() {
  const byDate = Object.fromEntries(days.map(d => [d.date, d]));
  const first = new Date(days[0].date + 'T00:00:00');
  const last = new Date(days[days.length - 1].date + 'T00:00:00');

  // Pad out to full Mon–Sun weeks.
  const start = new Date(first);
  const startDow = (start.getDay() + 6) % 7; // 0 = Monday
  start.setDate(start.getDate() - startDow);

  const end = new Date(last);
  const endDow = (end.getDay() + 6) % 7;
  end.setDate(end.getDate() + (6 - endDow));

  calendarGrid.innerHTML = '';
  let prevMonth = null;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const iso = toISODate(d);
    const entry = byDate[iso];
    const cell = document.createElement('div');
    const showMonth = d.getMonth() !== prevMonth;
    prevMonth = d.getMonth();

    if (!entry) {
      cell.className = 'day day--pad';
      cell.innerHTML = `
        <div class="day__head">
          <span class="day__num">${d.getDate()}</span>
          <span class="day__mon${showMonth ? ' day__mon--start' : ''}">${MONTH_ABBR[d.getMonth()]}</span>
        </div>
      `;
      calendarGrid.appendChild(cell);
      continue;
    }

    cell.className = 'day';
    cell.dataset.tag = entry.tag;
    cell.dataset.travel = entry.travel ? 'true' : 'false';
    if (entry.mode) cell.dataset.mode = entry.mode;
    const trainLines = (entry.legIdx || []).map(i => {
      const leg = legs[i];
      let html = buildTrainLine(leg);
      if (leg && leg.retDep) {
        html += buildTrainLine({ train: leg.retTrain, dep: leg.retDep, arr: leg.retArr, cls: leg.cls });
      }
      return html;
    }).join('');
    cell.innerHTML = `
      <div class="day__head">
        <span class="day__num">${d.getDate()}</span>
        <span class="day__mon${showMonth ? ' day__mon--start' : ''}">${MONTH_ABBR[d.getMonth()]}</span>
      </div>
      <span class="day__badge"></span>
      <div class="day__body">
        <div class="day__city">${cleanLabel(entry.label)}</div>
        ${trainLines ? `<div class="day__trains">${trainLines}</div>` : ''}
      </div>
    `;
    cell.addEventListener('click', () => {
      flyToStop(entry.stopId);
      document.querySelectorAll('.day').forEach(el => el.classList.remove('is-active'));
      cell.classList.add('is-active');
      showDayDetail(entry.date);
    });
    calendarGrid.appendChild(cell);
  }
}

renderMap();
renderCalendar();

const masthead = document.querySelector('.masthead');
function onPanelScroll(e) {
  masthead.classList.toggle('masthead--compact', e.target.scrollTop > 8);
}
document.getElementById('calendar').addEventListener('scroll', onPanelScroll, { passive: true });
dayDetail.addEventListener('scroll', onPanelScroll, { passive: true });
</script>
</body>
</html>
