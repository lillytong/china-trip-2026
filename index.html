<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Trip 2026</title>
<meta name="description" content="A 12306-verified, 100% high-speed-rail loop through China — Beijing, Xi'an, Chongqing, Yunnan, Guilin/Yangshuo, and Shanghai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --ink: #10151f;
    --paper: #eef1ea;
    --card: #ffffff;
    --text: #1b2430;
    --text-muted: #5b6670;
    --rail: #c8102e;
    --rail-soft: rgba(200,16,46,0.12);
    --bus: #a8790a;
    --bus-soft: rgba(168,121,10,0.14);
    --line: rgba(27,36,48,0.12);
    --tag-culture: #6a4fa0;
    --tag-culture-soft: rgba(106,79,160,0.12);
    --tag-nature: #3c6e5c;
    --tag-nature-soft: rgba(60,110,92,0.12);
    --tag-city: #1d4e89;
    --tag-city-soft: rgba(29,78,137,0.12);
    --shadow: 0 1px 2px rgba(16,21,31,0.06), 0 8px 24px rgba(16,21,31,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef1ea;
      --paper: #10151f;
      --card: #171d28;
      --text: #eef1ea;
      --text-muted: #98a3ad;
      --rail-soft: rgba(255,90,110,0.16);
      --rail: #ff5a6e;
      --bus: #e0ab3f;
      --bus-soft: rgba(224,171,63,0.18);
      --line: rgba(238,241,234,0.14);
      --tag-culture: #b39ddb;
      --tag-culture-soft: rgba(179,157,219,0.16);
      --tag-nature: #7fbfa6;
      --tag-nature-soft: rgba(127,191,166,0.16);
      --tag-city: #7fb0e0;
      --tag-city-soft: rgba(127,176,224,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .masthead {
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 0.75rem 1.5rem;
    padding: 1.5rem clamp(1rem, 4vw, 3rem) 1.25rem;
    border-bottom: 1px solid var(--line);
    transition: padding 200ms ease;
  }
  .masthead__eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rail);
    margin: 0 0 0.4rem;
    transition: font-size 200ms ease, margin 200ms ease, opacity 150ms ease;
  }
  .masthead__title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    transition: font-size 200ms ease;
  }
  .masthead__meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.4rem;
  }
  @media (max-width: 640px) {
    .masthead__meta { align-items: flex-start; }
  }
  @media (max-width: 880px) {
    .masthead--compact { padding-top: 0.55rem; padding-bottom: 0.55rem; gap: 0.4rem 1rem; }
    .masthead--compact .masthead__eyebrow { font-size: 0; margin: 0; opacity: 0; }
    .masthead--compact .masthead__title { font-size: 1.15rem; }
    .masthead--compact .legend { display: none; }
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border-bottom: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
  }
  .stats__item {
    flex: 1 1 120px;
    padding: 0.9rem clamp(1rem, 4vw, 3rem);
    border-right: 1px solid var(--line);
  }
  .stats__item:last-child { border-right: none; }
  .stats__value {
    font-size: 1.4rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .stats__label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
    min-height: 0;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
  }

  .map-wrap {
    position: relative;
    height: 100%;
    width: 100%;
    min-height: 0;
  }

  #map {
    height: 100%;
    width: 100%;
    background: var(--card);
  }

  .leaflet-control-attribution { display: none !important; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
    align-items: center;
    white-space: nowrap;
  }
  .legend__swatch { display: inline-flex; align-items: center; gap: 0.3rem; flex: none; }
  .legend__line { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--rail); }
  .legend__line--flag { border-top: 3px dashed var(--rail); }
  @media (max-width: 640px) {
    .legend { gap: 0.4rem; font-size: 0.6rem; flex-wrap: nowrap; }
    .legend__swatch { gap: 0.2rem; }
    .legend__speed { display: none; }
  }

  .panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    border-left: 1px solid var(--line);
  }
  @media (max-width: 880px) {
    .panel { border-left: none; border-top: 1px solid var(--line); }
  }

  .timeline {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  .stop {
    display: flex;
    gap: 0.9rem;
    padding: 1.1rem clamp(1rem, 4vw, 1.5rem);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    background: transparent;
    transition: background 120ms ease;
  }
  .stop:hover, .stop.is-active { background: var(--rail-soft); }
  .stop--waypoint { opacity: 0.7; }

  .stop__num {
    flex: none;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--rail);
    color: var(--rail);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 0.1rem;
  }
  .stop--waypoint .stop__num { border-color: var(--text-muted); color: var(--text-muted); width: 1.4rem; height: 1.4rem; font-size: 0.65rem; }

  .stop__body { flex: 1; min-width: 0; }
  .stop__top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
  .stop__name {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
  }
  .stop__dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .stop__note { font-size: 0.88rem; color: var(--text-muted); margin: 0.3rem 0 0.55rem; line-height: 1.45; }

  .tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
  }
  .tag--culture { background: var(--tag-culture-soft); color: var(--tag-culture); }
  .tag--nature { background: var(--tag-nature-soft); color: var(--tag-nature); }
  .tag--city { background: var(--tag-city-soft); color: var(--tag-city); }

  .leg {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    margin-left: 2.8rem;
    padding: 0.6rem clamp(1rem, 4vw, 1.5rem) 0.6rem 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    border-bottom: 1px solid var(--line);
  }
  .leg__body { display: flex; flex-direction: column; gap: 0.15rem; }
  .leg__route { color: var(--text); }
  .leg__meta { font-size: 0.68rem; }
  .leg--flag .leg__note { color: var(--rail); }

  .hsr-pill {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--card);
  }
  .hsr-pill--g { background: var(--rail); }
  .hsr-pill--d { background: var(--tag-city); }
  .hsr-pill--c { background: var(--tag-nature); }

  .itin-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    flex: none;
    padding: 0.9rem clamp(1rem, 4vw, 1.5rem);
    border-bottom: 1px solid var(--line);
  }
  .itin-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-muted);
    cursor: pointer;
  }
  .itin-tab:hover { color: var(--text); }
  .itin-tab.is-active { background: var(--rail); color: var(--card); border-color: var(--rail); }

  .itin-tabs--map { display: none; }
  @media (max-width: 880px) {
    .itin-tabs--panel { display: none; }
    .itin-tabs--map {
      display: flex;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      margin: 0;
      padding: 0.55rem clamp(0.75rem, 4vw, 1.5rem);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(4px);
      border-top: 1px solid var(--line);
      border-bottom: none;
      gap: 0.4rem;
    }
    .itin-tabs--map .itin-tab { flex: 1; text-align: center; padding: 0.4rem 0.5rem; font-size: 0.62rem; }
  }

  .totalbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.3rem 0.9rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .totalbar strong { color: var(--text); font-variant-numeric: tabular-nums; }

  .leaflet-popup-content-wrapper {
    background: var(--card);
    color: var(--text);
    border-radius: 6px;
  }
  .leaflet-popup-tip { background: var(--card); }
  .leaflet-popup-content { margin: 0; width: 380px !important; }
  .popup { display: flex; align-items: stretch; gap: 0; }
  .popup__info { flex: 0 0 128px; min-width: 0; padding: 0.55rem 0.6rem; display: flex; flex-direction: column; justify-content: flex-start; }
  .popup__media { flex: 1; min-width: 0; }
  .popup__name { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.05rem; line-height: 1.1; margin: 0 0 0.1rem; }
  .popup__dates { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--text-muted); margin: 0 0 0.25rem; }
  .popup__note { font-size: 0.76rem; margin: 0; line-height: 1.25; }

  .carousel {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    border-radius: 0 6px 6px 0;
  }
  .carousel__track {
    display: flex;
    height: 100%;
    transition: transform 220ms ease;
  }
  .carousel__slide { flex: none; width: 100%; height: 100%; position: relative; }
  .carousel__img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .carousel__caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0.25rem 0.5rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
  }
  .carousel__btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(16,21,31,0.45);
    color: #fff;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .carousel__btn:hover { background: rgba(16,21,31,0.7); }
  .carousel__btn--prev { left: 6px; }
  .carousel__btn--next { right: 6px; }
  .carousel__dots {
    position: absolute;
    bottom: 4px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 4px;
  }
  .carousel__dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5); }
  .carousel__dot.is-active { background: #fff; }

  @media (max-width: 640px) {
    .leaflet-popup-content { width: 220px !important; }
    .popup__info { flex-basis: 78px; padding: 0.4rem 0.4rem; gap: 0; }
    .popup__name { font-size: 0.76rem; line-height: 1.05; margin: 0; }
    .popup__dates { font-size: 0.5rem; margin: 0; }
    .popup__note {
      font-size: 0.58rem;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .carousel__caption { font-size: 0.46rem; padding: 0.15rem 0.3rem; }
    .carousel__btn { width: 30px; height: 30px; font-size: 1rem; }
    .carousel__btn--prev { left: 4px; }
    .carousel__btn--next { right: 4px; }
    .carousel__dots { bottom: 3px; gap: 3px; }
    .carousel__dot { width: 4px; height: 4px; }
  }

  .leaflet-tooltip.leg-label {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    font-weight: 500;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .leaflet-tooltip.leg-label::before { display: none; }
</style>
</head>
<body>

<header class="masthead">
  <div>
    <p class="masthead__eyebrow">Sep 30 – Oct 28 · 2026</p>
    <h1 class="masthead__title">China Trip 2026</h1>
  </div>
  <div class="masthead__meta">
    <div class="legend">
      <span class="legend__swatch"><span class="hsr-pill hsr-pill--g">G</span> Gaotie <span class="legend__speed">(350km/h)</span></span>
      <span class="legend__swatch"><span class="hsr-pill hsr-pill--d">D</span> Dongche <span class="legend__speed">(250km/h)</span></span>
      <span class="legend__swatch"><span class="hsr-pill hsr-pill--c">C</span> Chengji <span class="legend__speed">(200km/h)</span></span>
      <span class="legend__swatch"><span class="legend__line legend__line--flag"></span> long day</span>
    </div>
    <div class="totalbar" id="totalbar"></div>
  </div>
</header>

<div class="layout">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="itin-tabs itin-tabs--map">
      <button class="itin-tab" data-itin="itin1">Itinerary 1</button>
      <button class="itin-tab" data-itin="itin2">Itinerary 2</button>
    </div>
  </div>
  <div class="panel">
    <div class="itin-tabs itin-tabs--panel" id="itinTabs">
      <button class="itin-tab" data-itin="itin1">Itinerary 1 — via Yunnan</button>
      <button class="itin-tab" data-itin="itin2">Itinerary 2 — via Changsha/Zhangjiajie</button>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</div>

let carouselSeq = 0;
function buildCarousel(cityName) {
  const images = CITY_IMAGES[cityName];
  if (!images || !images.length) return '';
  const id = `car${carouselSeq++}`;
  const slides = images.map(img => `
    <div class="carousel__slide">
      <img class="carousel__img" src="${img.url}" alt="${img.caption}" loading="lazy">
      <span class="carousel__caption">${img.caption}</span>
    </div>
  `).join('');
  const dots = images.map((_, i) => `<span class="carousel__dot${i === 0 ? ' is-active' : ''}"></span>`).join('');
  return `
    <div class="carousel" id="${id}" data-index="0" data-count="${images.length}">
      <div class="carousel__track">${slides}</div>
      ${images.length > 1 ? `
        <button class="carousel__btn carousel__btn--prev" onclick="carouselNav('${id}', -1)">‹</button>
        <button class="carousel__btn carousel__btn--next" onclick="carouselNav('${id}', 1)">›</button>
        <div class="carousel__dots">${dots}</div>
      ` : ''}
    </div>
  `;
}

window.carouselNav = function(id, delta) {
  const el = document.getElementById(id);
  if (!el) return;
  const count = +el.dataset.count;
  let idx = (+el.dataset.index + delta + count) % count;
  el.dataset.index = idx;
  el.querySelector('.carousel__track').style.transform = `translateX(-${idx * 100}%)`;
  el.querySelectorAll('.carousel__dot').forEach((d, i) => d.classList.toggle('is-active', i === idx));
};

function parseDuration(str) {
  const h = /(\d+)h/.exec(str), m = /(\d+)m/.exec(str);
  return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
}
function formatDuration(mins) {
  return `${Math.floor(mins / 60)}h${String(mins % 60).padStart(2, '0')}m`;
}

const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pillColor = cls => cls === 'G' ? cssVar('--rail') : cls === 'D' ? cssVar('--tag-city') : cssVar('--tag-nature');

function markerIcon(stop) {
  const isReturn = stop.id === 'bj2';
  const label = stop.kind === 'waypoint' || isReturn ? '' : stop.num;
  const style = stop.kind === 'waypoint'
    ? 'width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--text-muted);'
    : isReturn
      ? 'width:20px;height:20px;border-radius:50%;background:var(--rail);border:2.5px solid var(--rail);box-shadow:0 2px 6px rgba(16,21,31,0.25);'
      : 'width:30px;height:30px;border-radius:50%;background:var(--card);border:2.5px solid var(--rail);color:var(--rail);display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-weight:500;font-size:12px;box-shadow:0 2px 6px rgba(16,21,31,0.25);';
  const size = stop.kind === 'waypoint' ? 14 : isReturn ? 20 : 30;
  return L.divIcon({
    className: '',
    html: `<div style="${style}">${label}</div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -14],
  });
}

function render(itinId) {
  const itin = itineraries[itinId];
  const { stops, legs } = itin;
  const byId = Object.fromEntries(stops.map(s => [s.id, s]));

  document.querySelectorAll('.itin-tab').forEach(t => t.classList.toggle('is-active', t.dataset.itin === itinId));

  layerGroup.clearLayers();
  const markers = {};
  stops.forEach(stop => {
    const marker = L.marker(stop.coord, { icon: markerIcon(stop) }).addTo(layerGroup);
    marker.bindPopup(`
      <div class="popup">
        <div class="popup__info">
          <p class="popup__name">${stop.name}</p>
          <p class="popup__dates">${stop.dates}</p>
          <p class="popup__note">${stop.note}</p>
        </div>
        <div class="popup__media">${buildCarousel(stop.name)}</div>
      </div>
    `, { minWidth: 380, maxWidth: 380, autoPan: true, autoPanPadding: [20, 20] });
    markers[stop.id] = marker;
  });
  legs.forEach(leg => {
    const from = byId[leg.from], to = byId[leg.to];
    const line = L.polyline([from.coord, to.coord], {
      color: pillColor(leg.cls), weight: 3, dashArray: leg.flag ? '9 6' : null, opacity: 0.9,
    }).addTo(layerGroup);
    line.bindTooltip(leg.duration, { permanent: true, direction: 'center', className: 'leg-label' });
  });
  map.setView([32, 108], 4.4);

  const totalMins = legs.reduce((sum, l) => sum + parseDuration(l.duration), 0);
  totalbar.innerHTML = `<span>Total rail time: <strong>${formatDuration(totalMins)}</strong> across ${legs.length} legs</span>`;

  timeline.innerHTML = '';
  stops.forEach(stop => {
    const el = document.createElement('div');
    el.className = 'stop' + (stop.kind === 'waypoint' ? ' stop--waypoint' : '');
    el.innerHTML = `
      <div class="stop__num">${stop.kind === 'waypoint' ? '·' : stop.num}</div>
      <div class="stop__body">
        <div class="stop__top">
          <span class="stop__name">${stop.name}</span>
          <span class="stop__dates">${stop.dates}</span>
        </div>
        <p class="stop__note">${stop.note}</p>
        <span class="tag tag--${stop.tag}">${stop.tag}</span>
      </div>
    `;
    el.addEventListener('click', () => {
      map.flyTo(stop.coord, 7, { duration: 0.8 });
      map.once('moveend', () => markers[stop.id].openPopup());
      document.querySelectorAll('.stop').forEach(s => s.classList.remove('is-active'));
      el.classList.add('is-active');
    });
    timeline.appendChild(el);

    const leg = legs.find(l => l.from === stop.id);
    if (leg) {
      const legEl = document.createElement('div');
      legEl.className = 'leg' + (leg.flag ? ' leg--flag' : '');
      legEl.innerHTML = `
        <span class="hsr-pill hsr-pill--${leg.cls.toLowerCase()}">${leg.cls}</span>
        <div class="leg__body">
          <span class="leg__route">${leg.train} · ${leg.route}</span>
          <span class="leg__meta">${leg.dep}–${leg.arr} · ${leg.duration}${leg.flag ? ' · longest day' : ''}</span>
          ${leg.note ? `<span class="leg__note">${leg.note}</span>` : ''}
        </div>
      `;
      timeline.appendChild(legEl);
    }
  });
}

document.querySelectorAll('.itin-tab').forEach(tab => {
  tab.addEventListener('click', () => render(tab.dataset.itin));
});
