<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Trip 2026</title>
<meta name="description" content="A 12306-verified, 100% high-speed-rail loop through China — Beijing, Xi'an, Chongqing, Yunnan, Guilin/Yangshuo, and Shanghai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --ink: #10151f;
    --paper: #eef1ea;
    --card: #ffffff;
    --text: #1b2430;
    --text-muted: #5b6670;
    --rail: #c8102e;
    --rail-soft: rgba(200,16,46,0.12);
    --bus: #a8790a;
    --bus-soft: rgba(168,121,10,0.14);
    --line: rgba(27,36,48,0.12);
    --tag-culture: #6a4fa0;
    --tag-culture-soft: rgba(106,79,160,0.12);
    --tag-nature: #3c6e5c;
    --tag-nature-soft: rgba(60,110,92,0.12);
    --tag-city: #1d4e89;
    --tag-city-soft: rgba(29,78,137,0.12);
    --shadow: 0 1px 2px rgba(16,21,31,0.06), 0 8px 24px rgba(16,21,31,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef1ea;
      --paper: #10151f;
      --card: #171d28;
      --text: #eef1ea;
      --text-muted: #98a3ad;
      --rail-soft: rgba(255,90,110,0.16);
      --rail: #ff5a6e;
      --bus: #e0ab3f;
      --bus-soft: rgba(224,171,63,0.18);
      --line: rgba(238,241,234,0.14);
      --tag-culture: #b39ddb;
      --tag-culture-soft: rgba(179,157,219,0.16);
      --tag-nature: #7fbfa6;
      --tag-nature-soft: rgba(127,191,166,0.16);
      --tag-city: #7fb0e0;
      --tag-city-soft: rgba(127,176,224,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .masthead {
    padding: 2rem clamp(1rem, 4vw, 3rem) 1.25rem;
    border-bottom: 1px solid var(--line);
  }
  .masthead__eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rail);
    margin: 0 0 0.4rem;
  }
  .masthead__title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    margin: 0 0 0.6rem;
    text-wrap: balance;
  }
  .masthead__sub {
    font-size: 1rem;
    color: var(--text-muted);
    max-width: 62ch;
    margin: 0;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border-bottom: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
  }
  .stats__item {
    flex: 1 1 120px;
    padding: 0.9rem clamp(1rem, 4vw, 3rem);
    border-right: 1px solid var(--line);
  }
  .stats__item:last-child { border-right: none; }
  .stats__value {
    font-size: 1.4rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .stats__label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
    align-items: start;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
  }

  #map {
    height: min(78vh, 720px);
    width: 100%;
    background: var(--card);
  }
  @media (max-width: 880px) {
    #map { height: 62vh; }
  }

  .legend {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 1rem;
    padding: 0.6rem clamp(1rem, 4vw, 1.5rem);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    border-bottom: 1px solid var(--line);
    align-items: center;
    white-space: nowrap;
  }
  .legend__swatch { display: inline-flex; align-items: center; gap: 0.35rem; flex: none; }
  .legend__line { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--rail); }
  .legend__line--flag { border-top: 3px dashed var(--rail); }

  .panel {
    display: flex;
    flex-direction: column;
    max-height: min(78vh, 720px);
    border-left: 1px solid var(--line);
  }
  @media (max-width: 880px) {
    .panel { max-height: none; border-left: none; border-top: 1px solid var(--line); }
  }

  .timeline {
    flex: 1;
    overflow-y: auto;
  }

  .stop {
    display: flex;
    gap: 0.9rem;
    padding: 1.1rem clamp(1rem, 4vw, 1.5rem);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    background: transparent;
    transition: background 120ms ease;
  }
  .stop:hover, .stop.is-active { background: var(--rail-soft); }
  .stop--waypoint { opacity: 0.7; }

  .stop__num {
    flex: none;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--rail);
    color: var(--rail);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 0.1rem;
  }
  .stop--waypoint .stop__num { border-color: var(--text-muted); color: var(--text-muted); width: 1.4rem; height: 1.4rem; font-size: 0.65rem; }

  .stop__body { flex: 1; min-width: 0; }
  .stop__top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
  .stop__name {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
  }
  .stop__dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .stop__note { font-size: 0.88rem; color: var(--text-muted); margin: 0.3rem 0 0.55rem; line-height: 1.45; }

  .tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
  }
  .tag--culture { background: var(--tag-culture-soft); color: var(--tag-culture); }
  .tag--nature { background: var(--tag-nature-soft); color: var(--tag-nature); }
  .tag--city { background: var(--tag-city-soft); color: var(--tag-city); }

  .leg {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    margin-left: 2.8rem;
    padding: 0.6rem clamp(1rem, 4vw, 1.5rem) 0.6rem 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    border-bottom: 1px solid var(--line);
  }
  .leg__body { display: flex; flex-direction: column; gap: 0.15rem; }
  .leg__route { color: var(--text); }
  .leg__meta { font-size: 0.68rem; }
  .leg--flag .leg__note { color: var(--rail); }

  .hsr-pill {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--card);
  }
  .hsr-pill--g { background: var(--rail); }
  .hsr-pill--d { background: var(--tag-city); }
  .hsr-pill--c { background: var(--tag-nature); }

  .itin-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    flex: none;
    padding: 0.9rem clamp(1rem, 4vw, 1.5rem);
    border-bottom: 1px solid var(--line);
  }
  .itin-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-muted);
    cursor: pointer;
  }
  .itin-tab:hover { color: var(--text); }
  .itin-tab.is-active { background: var(--rail); color: var(--card); border-color: var(--rail); }

  .totalbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    padding: 0.6rem clamp(1rem, 4vw, 1.5rem);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    border-bottom: 1px solid var(--line);
  }
  .totalbar strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .totalbar .savings { color: var(--tag-nature); }

  footer {
    padding: 1.2rem clamp(1rem, 4vw, 3rem) 2rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .leaflet-popup-content-wrapper {
    background: var(--card);
    color: var(--text);
    border-radius: 6px;
  }
  .leaflet-popup-tip { background: var(--card); }
  .popup__name { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.1rem; margin: 0 0 0.2rem; }
  .popup__dates { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-muted); margin: 0 0 0.4rem; }
  .popup__note { font-size: 0.82rem; margin: 0; }
</style>
</head>
<body>

<header class="masthead">
  <p class="masthead__eyebrow">Sep 30 – Oct 28 · 2026</p>
  <h1 class="masthead__title">China Trip 2026</h1>
</header>

<div class="legend">
  <span class="legend__swatch"><span class="hsr-pill hsr-pill--g">G</span> Gaotie</span>
  <span class="legend__swatch"><span class="hsr-pill hsr-pill--d">D</span> Dongche</span>
  <span class="legend__swatch"><span class="hsr-pill hsr-pill--c">C</span> Chengji</span>
  <span class="legend__swatch"><span class="legend__line legend__line--flag"></span> long day</span>
</div>

<div class="totalbar" id="totalbar"></div>

<div class="layout">
  <div id="map"></div>
  <div class="panel">
    <div class="itin-tabs" id="itinTabs">
      <button class="itin-tab" data-itin="itin1">Itinerary 1 — via Yunnan</button>
      <button class="itin-tab" data-itin="itin2">Itinerary 2 — via Changsha/Zhangjiajie</button>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<footer>Made for the trip — map tiles © Esri. Train numbers and times checked directly against 12306.cn; schedules can shift closer to travel, so re-confirm before booking (12306 opens ticket sales ~15 days ahead).</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const itineraries = {
  itin1: {
    label: 'Itinerary 1',
    stops: [
      { id: 'bj1', num: 1, name: 'Beijing', dates: 'Sep 30 – Oct 7', tag: 'culture', kind: 'stop',
        note: "Arrive, settle in with family, ease into the trip. Golden Week (Oct 1–7) overlaps, so it's Forbidden City, Summer Palace, and the Great Wall at Mutianyu (not Badaling) with tickets booked well ahead.",
        coord: [39.9042, 116.4074] },
      { id: 'xa', num: 2, name: "Xi'an", dates: 'Oct 7 – 10', tag: 'culture', kind: 'stop',
        note: 'The Terracotta Army, then two wheels around the old City Wall.',
        coord: [34.3416, 108.9398] },
      { id: 'cq', num: 3, name: 'Chongqing', dates: 'Oct 10 – 13', tag: 'city', kind: 'stop',
        note: 'Cliffside mountain city, cable cars over the river, and proper Chongqing hotpot.',
        coord: [29.5630, 106.5516] },
      { id: 'km', num: 4, name: 'Kunming', dates: 'transit', tag: 'city', kind: 'waypoint',
        note: 'Rail junction into Yunnan — not a stop, just the way through.',
        coord: [24.8801, 102.8329] },
      { id: 'dl', num: 5, name: 'Dali', dates: 'Oct 13 – 17', tag: 'nature', kind: 'stop',
        note: "Erhai Lake and the old town — Yunnan's one stop on this trip.",
        coord: [25.6065, 100.2676] },
      { id: 'yy', num: 6, name: 'Guilin / Yangshuo', dates: 'Oct 17 – 20', tag: 'nature', kind: 'stop',
        note: 'Li River karst peaks — cycling the countryside between rice paddies.',
        coord: [24.7770, 110.4996] },
      { id: 'sh', num: 7, name: 'Shanghai', dates: 'Oct 20 – 24', tag: 'city', kind: 'stop',
        note: 'Bund skyline, French Concession streets, and a ride on the Maglev.',
        coord: [31.2304, 121.4737] },
      { id: 'bj2', num: 8, name: 'Beijing', dates: 'Oct 25 – 28', tag: 'culture', kind: 'stop',
        note: 'Back to family for the final days before flying out Oct 28.',
        coord: [39.9042, 116.4074] },
    ],
    legs: [
      { from: 'bj1', to: 'xa', train: 'G351', route: "Beijing West → Xi'an North", dep: '07:55', arr: '12:05', duration: '4h10m', cls: 'G', flag: false },
      { from: 'xa', to: 'cq', train: 'D997', route: "Xi'an North → Chongqing West", dep: '05:18', arr: '10:22', duration: '5h04m', cls: 'D', flag: false },
      { from: 'cq', to: 'km', train: 'G2873', route: 'Chongqing West → Kunming South', dep: '08:49', arr: '13:58', duration: '5h09m', cls: 'G', flag: false },
      { from: 'km', to: 'dl', train: 'D8653', route: 'Kunming South → Dali', dep: '06:50', arr: '09:08', duration: '2h18m', cls: 'D', flag: false },
      { from: 'dl', to: 'yy', train: 'D3934', route: 'Dali → Guilin North (via Kunming South)', dep: '08:37', arr: '18:52', duration: '10h15m', cls: 'D', flag: true,
        note: 'Through-train — stops ~5min at Kunming South, no change of train. Longest day of the trip; alt: break it with an overnight in Kunming, then a fresh ~4.5h morning train to Guilin.' },
      { from: 'yy', to: 'sh', train: 'G264', route: 'Guilin → Shanghai Hongqiao', dep: '12:05', arr: '19:30', duration: '7h25m', cls: 'G', flag: false },
      { from: 'sh', to: 'bj2', train: 'G2', route: 'Shanghai Hongqiao → Beijing South', dep: '06:43', arr: '11:32', duration: '4h49m', cls: 'G', flag: false },
    ],
  },
  itin2: {
    label: 'Itinerary 2',
    stops: [
      { id: 'bj1', num: 1, name: 'Beijing', dates: 'Sep 30 – Oct 7', tag: 'culture', kind: 'stop',
        note: "Arrive, settle in with family, ease into the trip. Golden Week (Oct 1–7) overlaps, so it's Forbidden City, Summer Palace, and the Great Wall at Mutianyu (not Badaling) with tickets booked well ahead.",
        coord: [39.9042, 116.4074] },
      { id: 'xa', num: 2, name: "Xi'an", dates: 'Oct 7 – 10', tag: 'culture', kind: 'stop',
        note: 'The Terracotta Army, then two wheels around the old City Wall.',
        coord: [34.3416, 108.9398] },
      { id: 'cq', num: 3, name: 'Chongqing', dates: 'Oct 10 – 13', tag: 'city', kind: 'stop',
        note: 'Cliffside mountain city, cable cars over the river, and proper Chongqing hotpot.',
        coord: [29.5630, 106.5516] },
      { id: 'yy', num: 4, name: 'Guilin / Yangshuo', dates: 'Oct 13 – 16', tag: 'nature', kind: 'stop',
        note: 'Li River karst peaks — cycling the countryside between rice paddies. Reached direct from Chongqing this time, no Yunnan detour.',
        coord: [24.7770, 110.4996] },
      { id: 'cs', num: 5, name: 'Changsha', dates: 'Oct 16 – 17', tag: 'culture', kind: 'stop',
        note: "Hunan's capital — Yuelu Mountain, fiery Hunan food, and the gateway to Zhangjiajie. Brief stop.",
        coord: [28.2282, 112.9388] },
      { id: 'zj', num: 6, name: 'Zhangjiajie', dates: 'Oct 17 – 20', tag: 'nature', kind: 'stop',
        note: 'Sandstone pillar mountains, glass bridge, serious hiking — the "Avatar" scenery. Distinct terrain from Guilin, not redundant.',
        coord: [29.1274, 110.4790] },
      { id: 'sh', num: 7, name: 'Shanghai', dates: 'Oct 20 – 24', tag: 'city', kind: 'stop',
        note: 'Bund skyline, French Concession streets, and a ride on the Maglev.',
        coord: [31.2304, 121.4737] },
      { id: 'bj2', num: 8, name: 'Beijing', dates: 'Oct 25 – 28', tag: 'culture', kind: 'stop',
        note: 'Back to family for the final days before flying out Oct 28.',
        coord: [39.9042, 116.4074] },
    ],
    legs: [
      { from: 'bj1', to: 'xa', train: 'G351', route: "Beijing West → Xi'an North", dep: '07:55', arr: '12:05', duration: '4h10m', cls: 'G', flag: false },
      { from: 'xa', to: 'cq', train: 'D997', route: "Xi'an North → Chongqing West", dep: '05:18', arr: '10:22', duration: '5h04m', cls: 'D', flag: false },
      { from: 'cq', to: 'yy', train: 'G3723', route: 'Chongqing West → Guilin West', dep: '10:06', arr: '13:49', duration: '3h43m', cls: 'G', flag: false },
      { from: 'yy', to: 'cs', train: 'G2066', route: 'Guilin → Changsha South', dep: '10:15', arr: '13:12', duration: '2h57m', cls: 'G', flag: false },
      { from: 'cs', to: 'zj', train: 'C7752', route: 'Changsha → Zhangjiajie West', dep: '07:10', arr: '09:02', duration: '1h52m', cls: 'C', flag: false },
      { from: 'zj', to: 'sh', train: 'G221', route: 'Zhangjiajie West → Shanghai Hongqiao', dep: '14:39', arr: '21:57', duration: '7h18m', cls: 'G', flag: true,
        note: 'Direct — no backtrack through Changsha needed. Longest single leg of this itinerary, but under Itinerary 1\'s longest day by almost 3 hours.' },
      { from: 'sh', to: 'bj2', train: 'G2', route: 'Shanghai Hongqiao → Beijing South', dep: '06:43', arr: '11:32', duration: '4h49m', cls: 'G', flag: false },
    ],
  },
};

function parseDuration(str) {
  const h = /(\d+)h/.exec(str), m = /(\d+)m/.exec(str);
  return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
}
function formatDuration(mins) {
  return `${Math.floor(mins / 60)}h${String(mins % 60).padStart(2, '0')}m`;
}

const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pillColor = cls => cls === 'G' ? cssVar('--rail') : cls === 'D' ? cssVar('--tag-city') : cssVar('--tag-nature');

const map = L.map('map', { scrollWheelZoom: true }).setView([32, 108], 4.4);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18,
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap contributors, GIS User Community'
}).addTo(map);

let layerGroup = L.layerGroup().addTo(map);
const timeline = document.getElementById('timeline');
const totalbar = document.getElementById('totalbar');

function markerIcon(stop) {
  const cls = stop.kind === 'waypoint' ? 'stop-marker stop-marker--waypoint' : 'stop-marker';
  const label = stop.kind === 'waypoint' ? '' : stop.num;
  return L.divIcon({
    className: '',
    html: `<div class="${cls}" style="${stop.kind === 'waypoint'
      ? 'width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--text-muted);'
      : 'width:30px;height:30px;border-radius:50%;background:var(--card);border:2.5px solid var(--rail);color:var(--rail);display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-weight:500;font-size:12px;box-shadow:0 2px 6px rgba(16,21,31,0.25);'}">${label}</div>`,
    iconSize: stop.kind === 'waypoint' ? [14, 14] : [30, 30],
    iconAnchor: stop.kind === 'waypoint' ? [7, 7] : [15, 15],
    popupAnchor: [0, -14],
  });
}

function render(itinId) {
  const itin = itineraries[itinId];
  const { stops, legs } = itin;
  const byId = Object.fromEntries(stops.map(s => [s.id, s]));

  document.querySelectorAll('.itin-tab').forEach(t => t.classList.toggle('is-active', t.dataset.itin === itinId));

  layerGroup.clearLayers();
  const markers = {};
  stops.forEach(stop => {
    const marker = L.marker(stop.coord, { icon: markerIcon(stop) }).addTo(layerGroup);
    marker.bindPopup(`<p class="popup__name">${stop.name}</p><p class="popup__dates">${stop.dates}</p><p class="popup__note">${stop.note}</p>`);
    markers[stop.id] = marker;
  });
  legs.forEach(leg => {
    const from = byId[leg.from], to = byId[leg.to];
    const line = L.polyline([from.coord, to.coord], {
      color: pillColor(leg.cls), weight: 3, dashArray: leg.flag ? '9 6' : null, opacity: 0.9,
    }).addTo(layerGroup);
    line.bindTooltip(`${leg.train} · ${leg.route} · ${leg.dep}–${leg.arr} · ${leg.duration}`, { sticky: true });
  });
  map.setView([32, 108], 4.4);

  const totalMins = legs.reduce((sum, l) => sum + parseDuration(l.duration), 0);
  const otherKey = itinId === 'itin1' ? 'itin2' : 'itin1';
  const otherMins = itineraries[otherKey].legs.reduce((sum, l) => sum + parseDuration(l.duration), 0);
  const diff = totalMins - otherMins;
  totalbar.innerHTML = `<span>Total rail time: <strong>${formatDuration(totalMins)}</strong> across ${legs.length} legs</span>` +
    (diff !== 0 ? `<span class="savings">${diff < 0 ? formatDuration(-diff) + ' less' : formatDuration(diff) + ' more'} than ${itineraries[otherKey].label}</span>` : '');

  timeline.innerHTML = '';
  stops.forEach(stop => {
    const el = document.createElement('div');
    el.className = 'stop' + (stop.kind === 'waypoint' ? ' stop--waypoint' : '');
    el.innerHTML = `
      <div class="stop__num">${stop.kind === 'waypoint' ? '·' : stop.num}</div>
      <div class="stop__body">
        <div class="stop__top">
          <span class="stop__name">${stop.name}</span>
          <span class="stop__dates">${stop.dates}</span>
        </div>
        <p class="stop__note">${stop.note}</p>
        <span class="tag tag--${stop.tag}">${stop.tag}</span>
      </div>
    `;
    el.addEventListener('click', () => {
      map.flyTo(stop.coord, 7, { duration: 0.8 });
      markers[stop.id].openPopup();
      document.querySelectorAll('.stop').forEach(s => s.classList.remove('is-active'));
      el.classList.add('is-active');
    });
    timeline.appendChild(el);

    const leg = legs.find(l => l.from === stop.id);
    if (leg) {
      const legEl = document.createElement('div');
      legEl.className = 'leg' + (leg.flag ? ' leg--flag' : '');
      legEl.innerHTML = `
        <span class="hsr-pill hsr-pill--${leg.cls.toLowerCase()}">${leg.cls}</span>
        <div class="leg__body">
          <span class="leg__route">${leg.train} · ${leg.route}</span>
          <span class="leg__meta">${leg.dep}–${leg.arr} · ${leg.duration}${leg.flag ? ' · longest day' : ''}</span>
          ${leg.note ? `<span class="leg__note">${leg.note}</span>` : ''}
        </div>
      `;
      timeline.appendChild(legEl);
    }
  });
}

document.querySelectorAll('.itin-tab').forEach(tab => {
  tab.addEventListener('click', () => render(tab.dataset.itin));
});

render('itin1');
</script>
</body>
</html>
